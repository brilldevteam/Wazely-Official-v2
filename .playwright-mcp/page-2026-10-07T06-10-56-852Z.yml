                  - generic [ref=f20e159]:
                    - generic [ref=f20e160]: STRONG BRAND
                    - generic [ref=f20e162]:
                      - heading "Easy API Credential Setup for Integration" [level=3] [ref=f20e163]
                      - paragraph [ref=f20e164]: To get started, you’ll need to enter your QuickBooks API credentials into your system’s settings. This step is important because it links your account securely and allows data to start flowing between the platforms. Once the credentials are added, the connection is established, and you can begin syncing invoices, payments, and account details without any hassle. Setting this up takes just a few minutes, and after that, you’ll have direct access to QuickBooks features right from your platform, helping you manage your finances more effectively.
                  - img "QuickBooks" [ref=f20e167]
                - generic [ref=f20e169]:
                  - img "QuickBooks" [ref=f20e172]
                  - generic [ref=f20e177]:
                    - heading "Simple Sync for Invoices and Accounts" [level=3] [ref=f20e178]
                    - paragraph [ref=f20e179]: Syncing your invoices and chart of accounts is straightforward. Once you’ve entered your QuickBooks credentials in the settings, you can quickly connect your system. After that, every time you create an invoice, you can sync it directly with QuickBooks with just a few clicks. The same applies to your chart of accounts—just follow the same setup steps, and you’ll be able to keep both systems updated with ease. This helps keep everything organized so you can focus more on running your business instead of managing paperwork.
                - generic [ref=f20e181]:
                  - generic [ref=f20e186]:
                    - heading "Get Real-Time Financial Insights" [level=3] [ref=f20e187]
                    - paragraph [ref=f20e188]: This integration also helps you understand your financial situation better by giving you access to real-time updates. As your data syncs automatically, you can easily track key financial details like income, expenses, and cash flow. Having this kind of visibility helps business owners and teams make smarter decisions since they can see what’s working and where improvements are needed. Whether you're reviewing your budget or planning for growth, having clear and current financial data makes the process much smoother.
                  - img "QuickBooks" [ref=f20e191]
